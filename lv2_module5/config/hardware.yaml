# Hardware record (장치 기록) — 어떤 노드도 이 파일을 읽지 않는다.
# OpenCR 펌웨어는 YAML을 읽을 수 없으므로 아래 값은 펌웨어 컴파일 상수가 실제 Source of Truth이다:
#   firmware/opencr/tracking_controller_2axis/tracking_controller_2axis.ino
# 이 파일은 그 상수와 실측 근거를 한 곳에 정리한 사본이다. 펌웨어 상수를 바꾸면 이 파일도 같은 commit에서 고친다.
# (호스트 실행값은 여기 두지 않는다: 포트·USB baud → ros2_ws/.../config/opencr_live.yaml, 방향 → control.yaml)

dynamixel:
  model: XM430-W350            # 모델 번호 1020 — 근거: results/logs/opencr/discovery_sdk_fix_20261006_103249/scan.log
  protocol_version: 2.0        # 펌웨어 CHECK에서 재확인 (getProtocolVersion)
  bus_baudrate: 1000000        # 펌웨어 dxl.init(..., 1000000) — Pi↔OpenCR USB 115200과 별개
  pan_id: 11                   # 펌웨어 IDS[0] — 근거: scan.log, docs/hardware.md (2026-10-06 실측)
  tilt_id: 12                  # 펌웨어 IDS[1]
  operating_mode: 1            # Velocity Mode — 펌웨어 CHECK가 1이 아니면 거부 (inspect.log 실측 1)
  # 원시 Goal_Velocity 양의 방향 (카메라 뒤에서 정면 기준) — 근거: pan_commission / tilt_commission test_notes
  pan_positive: left
  tilt_positive: down

firmware_limits:               # tracking_controller_2axis.ino 상수 사본 (2026-10-08) — 기구 안전 한계 승인 아님
  max_velocity_rad_s: 0.5      # MAX_RAD_S. 초과 VEL은 ERR RANGE (control_core.MAX_VELOCITY_RAD_S와 같은 값) — 추적 속도 요구 0.5 rad/s
  velocity_unit_rpm: 0.229     # XM430 Goal_Velocity 1 단위 (RAD_S_PER_UNIT = 0.229*2π/60 ≈ 0.02398 rad/s) → 0.5 rad/s ≈ 21 단위
  speed_margin_units: 3        # SPEED_MARGIN: 실제 속도가 최근 목표 |goal| + 3 단위보다 빠르면 FAULT UNEXPECTED_SPEED
  profile_acceleration: 10     # PROFILE_ACCEL (214.577 rev/min² 단위 → ≈3.7 rad/s²): 0.5 rad/s 정지 ≈0.13 s·≈22 counts
                               # (이전 1이면 ≈1.3 s → 500 ms 정지 확인·경계 여유 초과)
  command_timeout_ms: 300      # COMMAND_MS: 마지막 유효 명령 후 300 ms → 두 축 0 + DISARM (토크 유지)
  bus_watchdog_ticks: 10       # BUS_TICKS × 20 ms = 200 ms 모터 측 Bus_Watchdog (보드가 멈춰도 모터 정지)
  origin: stationary_pose_at_check   # ACCEPT_STATIONARY_POSE_AS_ORIGIN 1: CHECK 때 멈춘 자세가 원점 (중립 자세 검사 없음)
  neutral_tolerance_counts: 100      # NEUTRAL_TOL_COUNTS: HOLD 때 원점 대비 허용 (ACCEPT=0이면 PAN/TILT_NEUTRAL 1043/2161 기준 CHECK에도)
  outer_fault_counts: {pan: 1365, tilt: 682}   # OUTER_COUNTS: 원점 ±이 값(≈±120° / ±60°) 도달 → FAULT OUTER_BOUND
  stop_boundary_counts: {pan: 1305, tilt: 622} # STOP_COUNTS = OUTER − 60: 바깥 방향이면 두 축 정지, ARM 유지
                               #   → "EVENT LIMIT STOPPED ZERO_REQUESTED AXIS=PAN|TILT DIR=±1" (탐색 반환점, bridge가 정상 정지로 처리)
                               #   폐루프 시뮬레이션(0.5 rad/s 추적)에서 경계 넘은 거리 최대 27 counts — 실기 확인 TODO
  hold_drift_counts: 50        # HOLD_DRIFT_COUNTS: 영속도 축이 이만큼 밀리면 FAULT
  arm_pose_tolerance_counts: 120   # ARM_POSE_TOLERANCE_COUNTS: ARM 시 원점 대비 허용
  # TODO(실기): 실제 기구 안전 회전 범위를 확인해 OUTER/STOP 값과 원점 방식을 확정. 현재 값은 요청 범위이며 측정 근거가 없다.
  #             참고(토크 OFF 수동 측정, 재조립 전, 기구 한계 아님): Pan 좌 3482 / 우 2582, Tilt 위 3724 / 아래 4338
  #             (manual_pose_calibration.md) → 그때 수동 자세는 중립에서 약 ±400 counts.

camera:
  model: Intel RealSense D435  # Product ID 0x0B07 (IMU 없는 D435). 상세: ros2_ws/.../config/camera.yaml 주석
